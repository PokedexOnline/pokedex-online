<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokédex Online</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#080b10;
    color:#fff;
    min-height:100vh;
}

header{
    background:#10151d;
    border-bottom:1px solid #252d38;
    padding:18px 20px;
    position:sticky;
    top:0;
    z-index:100;
}

.header{
    max-width:1250px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#e63946;
}

nav{
    display:flex;
    gap:20px;
}

nav a{
    color:#aeb7c3;
    text-decoration:none;
    font-size:14px;
}

nav a:hover{
    color:#fff;
}

main{
    max-width:1250px;
    margin:auto;
    padding:50px 20px;
}

.hero{
    text-align:center;
    margin-bottom:40px;
}

.hero h1{
    font-size:48px;
    margin-bottom:12px;
}

.hero h1 span{
    color:#e63946;
}

.hero p{
    color:#8994a2;
    font-size:17px;
}

.search{
    max-width:720px;
    margin:28px auto 0;
    display:flex;
    gap:10px;
}

.search input{
    flex:1;
    background:#111720;
    border:1px solid #303a48;
    color:#fff;
    padding:16px;
    border-radius:10px;
    outline:none;
    font-size:16px;
}

.search input:focus{
    border-color:#e63946;
}

.search button{
    border:0;
    background:#e63946;
    color:white;
    padding:0 25px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.filters{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:9px;
    margin-bottom:35px;
}

.filter{
    background:#111720;
    border:1px solid #303a48;
    color:#b8c1cc;
    padding:9px 14px;
    border-radius:20px;
    cursor:pointer;
}

.filter:hover,
.filter.active{
    background:#e63946;
    color:white;
    border-color:#e63946;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.section-header h2{
    font-size:24px;
}

.counter{
    color:#7f8a98;
    font-size:14px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:18px;
}

.card{
    background:#111720;
    border:1px solid #252e3a;
    border-radius:16px;
    padding:18px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#e63946;
}

.number{
    text-align:left;
    color:#667383;
    font-size:13px;
}

.card img{
    width:140px;
    height:140px;
    object-fit:contain;
    display:block;
    margin:5px auto;
}

.card h3{
    font-size:20px;
    margin-bottom:10px;
}

.types{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:6px;
}

.type{
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.normal{background:#8d99ae}
.fogo{background:#f4511e}
.agua{background:#2196f3}
.eletrico{background:#f5c518;color:#111}
.planta{background:#43a047}
.gelo{background:#4dd0e1;color:#111}
.lutador{background:#d84315}
.veneno{background:#8e44ad}
.terra{background:#a67c52}
.voador{background:#78909c}
.psiquico{background:#ec407a}
.inseto{background:#7cb342}
.pedra{background:#827717}
.fantasma{background:#5e35b1}
.dragao{background:#3949ab}
.sombrio{background:#263238}
.aco{background:#607d8b}
.fada{background:#ec9bd3;color:#111}

.loading{
    text-align:center;
    padding:50px;
    color:#8b96a3;
}

.load-more{
    display:block;
    margin:35px auto 0;
    background:#e63946;
    color:#fff;
    border:0;
    padding:14px 30px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.load-more:hover{
    background:#c92f3c;
}

footer{
    border-top:1px solid #252d38;
    margin-top:60px;
    padding:30px;
    text-align:center;
    color:#667383;
}

/* =========================
   FICHA
========================= */

#pokemonDetails{
    display:none;
}

.detail-back{
    display:inline-block;
    background:#111720;
    border:1px solid #303a48;
    color:#fff;
    padding:11px 18px;
    border-radius:10px;
    cursor:pointer;
    margin-bottom:25px;
    font-weight:bold;
}

.detail-back:hover{
    border-color:#e63946;
}

.detail-header{
    background:#111720;
    border:1px solid #252e3a;
    border-radius:20px;
    padding:30px;
    text-align:center;
    margin-bottom:20px;
}

.detail-number{
    color:#667383;
    font-size:15px;
    margin-bottom:5px;
}

.detail-header h1{
    font-size:38px;
    margin-bottom:8px;
}

.subtitle{
    color:#8994a2;
    margin-bottom:20px;
}

.detail-types{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
}

.detail-images{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:20px;
}

.image-box{
    background:#111720;
    border:1px solid #252e3a;
    border-radius:20px;
    padding:20px;
    text-align:center;
}

.image-box h3{
    margin-bottom:10px;
}

.shiny-title{
    color:#f5c518;
}

.image-box img{
    width:100%;
    max-width:300px;
    height:300px;
    object-fit:contain;
}

.detail-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.detail-box{
    background:#111720;
    border:1px solid #252e3a;
    border-radius:18px;
    padding:24px;
}

.detail-box h2{
    font-size:21px;
    margin-bottom:18px;
}

.info-list{
    display:grid;
    gap:12px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    gap:20px;
    border-bottom:1px solid #252d38;
    padding-bottom:10px;
}

.info-row span:first-child{
    color:#8994a2;
}

.info-row span:last-child{
    font-weight:bold;
    text-align:right;
}

.abilities{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.ability{
    background:#1a222d;
    border:1px solid #303a48;
    padding:8px 12px;
    border-radius:10px;
}

.description{
    color:#b8c1cc;
    line-height:1.7;
}

.stats{
    display:grid;
    gap:12px;
}

.stat{
    display:grid;
    grid-template-columns:130px 1fr 45px;
    align-items:center;
    gap:10px;
}

.stat-name{
    color:#b8c1cc;
    font-size:14px;
}

.stat-bar{
    height:9px;
    background:#252d38;
    border-radius:10px;
    overflow:hidden;
}

.stat-fill{
    height:100%;
    background:#e63946;
    border-radius:10px;
}

.stat-value{
    text-align:right;
    font-weight:bold;
}

.weaknesses{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.weakness{
    padding:8px 12px;
    border-radius:20px;
    font-weight:bold;
    font-size:13px;
}

/* =========================
   EVOLUÇÕES
========================= */

.evolution-section{
    margin-top:20px;
}

.evolution-chain{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
}

.evolution-stage{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
}

.evolution-card{
    background:#151c25;
    border:1px solid #303a48;
    border-radius:15px;
    padding:15px;
    text-align:center;
    min-width:145px;
}

.evolution-card img{
    width:110px;
    height:110px;
    object-fit:contain;
}

.evolution-card h3{
    margin-top:5px;
    font-size:17px;
}

.evolution-arrow{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    color:#e63946;
    font-weight:bold;
    text-align:center;
}

.arrow{
    font-size:30px;
}

.evolution-condition{
    background:#252d38;
    padding:5px 9px;
    border-radius:8px;
    font-size:11px;
    color:#fff;
    max-width:150px;
}

/* =========================
   MEGA
========================= */

.tabs{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:25px 0;
}

.tab{
    background:#111720;
    color:#aeb7c3;
    border:1px solid #303a48;
    padding:12px 22px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.tab.active{
    background:#e63946;
    border-color:#e63946;
    color:#fff;
}

.tab-content{
    display:none;
}

.tab-content.active{
    display:block;
}

.mega-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}

.mega-card{
    background:#111720;
    border:1px solid #3a3030;
    border-radius:18px;
    padding:20px;
    text-align:center;
}

.mega-card h3{
    margin-bottom:15px;
    font-size:20px;
}

.mega-images{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.mega-image-box{
    background:#151c25;
    border-radius:14px;
    padding:10px;
}

.mega-image-box h4{
    font-size:12px;
    margin-bottom:5px;
    color:#aeb7c3;
}

.mega-image-box.shiny h4{
    color:#f5c518;
}

.mega-card img{
    width:100%;
    height:180px;
    object-fit:contain;
}

.mega-card .mega-types{
    margin-top:15px;
    display:flex;
    justify-content:center;
    gap:7px;
    flex-wrap:wrap;
}

.detail-loading{
    text-align:center;
    padding:80px 20px;
    color:#8994a2;
}

.mega-loading{
    text-align:center;
    padding:50px 20px;
    color:#8994a2;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .header{
        flex-direction:column;
    }

    nav{
        gap:14px;
    }

    .hero h1{
        font-size:36px;
    }

    .search{
        flex-direction:column;
    }

    .search button{
        padding:14px;
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .card img{
        width:110px;
        height:110px;
    }

    .detail-images,
    .detail-grid{
        grid-template-columns:1fr;
    }

    .detail-header h1{
        font-size:30px;
    }

    .image-box img{
        height:240px;
    }

    .stat{
        grid-template-columns:95px 1fr 35px;
    }

    .evolution-chain{
        flex-direction:column;
    }

    .evolution-stage{
        flex-direction:column;
    }

    .evolution-arrow{
        flex-direction:column;
    }

    .arrow{
        transform:rotate(90deg);
    }

    .mega-images{
        grid-template-columns:1fr 1fr;
    }

    .mega-card img{
        height:145px;
    }
}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">
    <span>Poké</span>dex Online
</div>

<nav>
    <a href="#" onclick="showPokedex();return false;">Início</a>
    <a href="#pokedex" onclick="showPokedex();">Pokédex</a>
    <a href="#tipos">Tipos</a>
    <a href="#geracoes">Gerações</a>
</nav>

</div>
</header>

<main>

<div id="pokedexPage">

<section class="hero">

<h1>
    <span>Pokédex</span> Online
</h1>

<p>
    Explore o mundo Pokémon.
    Encontre informações sobre Pokémon, tipos e evoluções.
</p>

<div class="search">

<input
    id="searchInput"
    type="text"
    placeholder="Pesquise por nome ou número..."
>

<button onclick="searchPokemon()">
    Pesquisar
</button>

</div>

</section>

<div class="filters" id="geracoes">

<button class="filter active" onclick="filterGeneration('all',this)">
    Todos
</button>

<button class="filter" onclick="filterGeneration(1,this)">
    Geração I
</button>

<button class="filter" onclick="filterGeneration(2,this)">
    Geração II
</button>

<button class="filter" onclick="filterGeneration(3,this)">
    Geração III
</button>

<button class="filter" onclick="filterGeneration(4,this)">
    Geração IV
</button>

<button class="filter" onclick="filterGeneration(5,this)">
    Geração V
</button>

<button class="filter" onclick="filterGeneration(6,this)">
    Geração VI
</button>

<button class="filter" onclick="filterGeneration(7,this)">
    Geração VII
</button>

<button class="filter" onclick="filterGeneration(8,this)">
    Geração VIII
</button>

<button class="filter" onclick="filterGeneration(9,this)">
    Geração IX
</button>

</div>

<section id="pokedex">

<div class="section-header">

<h2>Pokémon</h2>

<div class="counter" id="counter">
    Carregando...
</div>

</div>

<div id="pokemonGrid" class="grid">

<div class="loading">
    Carregando Pokémon...
</div>

</div>

<button
    id="loadMore"
    class="load-more"
    onclick="loadMore()"
    style="display:none;"
>
    Carregar mais
</button>

</section>

</div>

<section id="pokemonDetails">

<button class="detail-back" onclick="showPokedex()">
    ← Voltar para a Pokédex
</button>

<div id="detailContent">

<div class="detail-loading">
    Carregando informações...
</div>

</div>

</section>

</main>

<footer>
    Pokédex Online © 2026
</footer>

<script>

const API = "https://pokeapi.co/api/v2";
const TOTAL = 1025;

let allPokemon = [];
let displayedPokemon = [];
let currentGeneration = "all";
let visibleAmount = 40;

const typeNames = {
    normal:"Normal",
    fire:"Fogo",
    water:"Água",
    electric:"Elétrico",
    grass:"Planta",
    ice:"Gelo",
    fighting:"Lutador",
    poison:"Veneno",
    ground:"Terra",
    flying:"Voador",
    psychic:"Psíquico",
    bug:"Inseto",
    rock:"Pedra",
    ghost:"Fantasma",
    dragon:"Dragão",
    dark:"Sombrio",
    steel:"Aço",
    fairy:"Fada"
};

const typeClasses = {
    normal:"normal",
    fire:"fogo",
    water:"agua",
    electric:"eletrico",
    grass:"planta",
    ice:"gelo",
    fighting:"lutador",
    poison:"veneno",
    ground:"terra",
    flying:"voador",
    psychic:"psiquico",
    bug:"inseto",
    rock:"pedra",
    ghost:"fantasma",
    dragon:"dragao",
    dark:"sombrio",
    steel:"aco",
    fairy:"fada"
};

const typeIcons = {
    normal:"⚪",
    fire:"🔥",
    water:"💧",
    electric:"⚡",
    grass:"🌿",
    ice:"❄️",
    fighting:"🥊",
    poison:"☠️",
    ground:"🌎",
    flying:"🪽",
    psychic:"🔮",
    bug:"🐛",
    rock:"🪨",
    ghost:"👻",
    dragon:"🐉",
    dark:"🌑",
    steel:"⚙️",
    fairy:"✨"
};

function capitalize(text){

    return text.charAt(0).toUpperCase() + text.slice(1);

}

function formatName(name){

    return name
        .replace(/-/g," ")
        .split(" ")
        .map(word => capitalize(word))
        .join(" ");

}

async function getPokemon(id){

    const response = await fetch(
        `${API}/pokemon/${id}`
    );

    if(!response.ok){
        throw new Error("Erro ao buscar Pokémon");
    }

    return await response.json();

}

async function getSpecies(id){

    const response = await fetch(
        `${API}/pokemon-species/${id}`
    );

    if(!response.ok){
        throw new Error("Erro ao buscar espécie");
    }

    return await response.json();

}

/* =========================
   LISTA DE POKÉMON
========================= */

async function loadPokemon(){

    const grid =
        document.getElementById("pokemonGrid");

    grid.innerHTML = `
        <div class="loading">
            Carregando Pokémon...
        </div>
    `;

    try{

        const response = await fetch(
            `${API}/pokemon?limit=${TOTAL}&offset=0`
        );

        if(!response.ok){
            throw new Error("Erro na API");
        }

        const data = await response.json();

        allPokemon = data.results.map((pokemon,index)=>({

            id:index + 1,
            name:pokemon.name,
            generation:getGeneration(index + 1)

        }));

        displayedPokemon = allPokemon;

        renderPokemon();

    }catch(error){

        grid.innerHTML = `
            <div class="loading">
                Não foi possível carregar os Pokémon.
                <br><br>
                Atualize a página e tente novamente.
            </div>
        `;

        console.error(error);

    }

}

function getGeneration(id){

    if(id <= 151) return 1;
    if(id <= 251) return 2;
    if(id <= 386) return 3;
    if(id <= 493) return 4;
    if(id <= 649) return 5;
    if(id <= 721) return 6;
    if(id <= 809) return 7;
    if(id <= 905) return 8;

    return 9;

}

async function renderPokemon(){

    const grid =
        document.getElementById("pokemonGrid");

    const items =
        displayedPokemon.slice(
            0,
            visibleAmount
        );

    grid.innerHTML = "";

    if(items.length === 0){

        grid.innerHTML = `
            <div class="loading">
                Nenhum Pokémon encontrado.
            </div>
        `;

        return;

    }

    for(const pokemon of items){

        const card =
            document.createElement("div");

        card.className = "card";

        card.innerHTML = `

            <div class="number">
                #${String(pokemon.id).padStart(4,"0")}
            </div>

            <img
                src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${pokemon.id}.png"
                alt="${formatName(pokemon.name)}"
                loading="lazy"
            >

            <h3>
                ${formatName(pokemon.name)}
            </h3>

            <div class="types">

                <span class="type">
                    Carregando...
                </span>

            </div>

        `;

        grid.appendChild(card);

        loadCardData(
            card,
            pokemon.id
        );

    }

    document.getElementById("counter").textContent =
        `${displayedPokemon.length} Pokémon encontrados`;

    document.getElementById("loadMore").style.display =
        visibleAmount < displayedPokemon.length
        ? "block"
        : "none";

}

async function loadCardData(card,id){

    try{

        const pokemon =
            await getPokemon(id);

        const species =
            await getSpecies(id);

        const portugueseName =
            species.names.find(
                item =>
                    item.language.name === "pt"
            );

        if(portugueseName){

            card.querySelector("h3").textContent =
                portugueseName.name;

        }

        card.querySelector(".types").innerHTML =

            pokemon.types.map(item => {

                const type =
                    item.type.name;

                return `

                    <span class="type ${typeClasses[type]}">

                        ${typeIcons[type]}
                        ${typeNames[type]}

                    </span>

                `;

            }).join("");

        card.onclick = () =>
            openPokemon(id);

    }catch(error){

        console.error(error);

    }

}

/* =========================
   DESCRIÇÃO
========================= */

function getEnglishDescription(species){

    const entries =
        species.flavor_text_entries.filter(
            item =>
                item.language.name === "en"
        );

    if(!entries.length){

        return "Description not available.";

    }

    return entries[0].flavor_text
        .replace(/\f/g," ")
        .replace(/\n/g," ")
        .replace(/\r/g," ");

}

/* =========================
   EVOLUÇÃO
========================= */

function getEvolutionCondition(details){

    if(!details || !details.length){

        return "Evolution";

    }

    const d = details[0];

    if(d.min_level){

        return `Level ${d.min_level}`;

    }

    if(d.item){

        return formatName(d.item.name);

    }

    if(d.trigger && d.trigger.name === "trade"){

        if(d.trade_species){

            return `Trade for ${formatName(d.trade_species.name)}`;

        }

        return "Trade";

    }

    if(d.min_happiness){

        return `Friendship ${d.min_happiness}`;

    }

    if(d.min_affection){

        return `Affection ${d.min_affection}`;

    }

    if(d.min_beauty){

        return `Beauty ${d.min_beauty}`;

    }

    if(d.time_of_day){

        return `Time: ${capitalize(d.time_of_day)}`;

    }

    if(d.held_item){

        return `Hold ${formatName(d.held_item.name)}`;

    }

    if(d.known_move){

        return `Know ${formatName(d.known_move.name)}`;

    }

    if(d.known_move_type){

        return `Know a ${formatName(d.known_move_type.name)} move`;

    }

    if(d.location){

        return `Location: ${formatName(d.location.name)}`;

    }

    if(d.needs_overworld_rain){

        return "While raining";

    }

    if(d.turn_upside_down){

        return "Turn device upside down";

    }

    if(d.party_species){

        return `With ${formatName(d.party_species.name)} in party`;

    }

    if(d.party_type){

        return `With ${formatName(d.party_type.name)} type in party`;

    }

    if(d.relative_physical_stats !== null){

        if(d.relative_physical_stats === 1){

            return "Attack > Defense";

        }

        if(d.relative_physical_stats === -1){

            return "Attack < Defense";

        }

        return "Attack = Defense";

    }

    if(d.used_move){

        return `Use ${formatName(d.used_move.name)}`;

    }

    if(d.min_steps){

        return `${d.min_steps} steps`;

    }

    if(d.min_damage_taken){

        return `Take ${d.min_damage_taken} damage`;

    }

    return "Special condition";

}

async function getEvolutionChain(species){

    const response =
        await fetch(
            species.evolution_chain.url
        );

    return await response.json();

}

async function buildEvolutionHTML(chain){

    let html = "";

    async function processNode(node){

        const speciesId =
            node.species.url
                .split("/")
                .filter(Boolean)
                .pop();

        const pokemon =
            await getPokemon(speciesId);

        const species =
            await getSpecies(speciesId);

        const ptName =
            species.names.find(
                item =>
                    item.language.name === "pt"
            );

        const name =
            ptName
            ? ptName.name
            : formatName(node.species.name);

        const image =
            pokemon.sprites.other[
                "official-artwork"
            ].front_default;

        html += `

            <div class="evolution-card">

                <img
                    src="${image}"
                    alt="${name}"
                >

                <h3>${name}</h3>

                <small>
                    #${String(speciesId).padStart(4,"0")}
                </small>

            </div>

        `;

        if(node.evolves_to.length){

            for(const next of node.evolves_to){

                const condition =
                    getEvolutionCondition(
                        next.evolution_details
                    );

                html += `

                    <div class="evolution-arrow">

                        <div class="arrow">
                            →
                        </div>

                        <div class="evolution-condition">
                            ${condition}
                        </div>

                    </div>

                `;

                await processNode(next);

            }

        }

    }

    await processNode(chain);

    return html;

}

/* ==================================================
   MEGA EVOLUÇÕES — NOVA VERSÃO
================================================== */

async function getMegaEvolutions(pokemonName){

    const mega = [];

    const possibleForms = [

        `${pokemonName}-mega`,
        `${pokemonName}-mega-x`,
        `${pokemonName}-mega-y`

    ];

    const results =
        await Promise.allSettled(

            possibleForms.map(
                formName =>
                    fetch(
                        `${API}/pokemon-form/${formName}`
                    )
                    .then(response => {

                        if(!response.ok){

                            throw new Error("Form not found");

                        }

                        return response.json();

                    })
            )

        );

    for(const result of results){

        if(result.status !== "fulfilled"){
            continue;
        }

        try{

            const form = result.value;

            if(!form.is_mega){
                continue;
            }

            const pokemonId =
                form.pokemon.url
                    .split("/")
                    .filter(Boolean)
                    .pop();

            const pokemon =
                await getPokemon(pokemonId);

            const artwork =
                pokemon.sprites.other[
                    "official-artwork"
                ];

            if(!artwork || !artwork.front_default){
                continue;
            }

            const alreadyExists =
                mega.some(
                    item =>
                        item.id === pokemon.id
                );

            if(alreadyExists){
                continue;
            }

            mega.push({

                id:pokemon.id,

                name:formatName(
                    pokemon.name
                ),

                image:
                    artwork.front_default,

                shiny:
                    artwork.front_shiny,

                types:
                    pokemon.types

            });

        }catch(error){

            console.error(
                "Erro ao processar Mega:",
                error
            );

        }

    }

    return mega;

}

/* ==================================================

================================================== */

async function loadMegaTab(
    pokemonName,
    megaTab
){

    try{

        megaTab.innerHTML = `

            <div class="mega-loading">
                Procurando Mega Evoluções...
            </div>

        `;

        const megas =
            await getMegaEvolutions(
                pokemonName
            );

        if(!megas.length){

            megaTab.innerHTML = `

                <div class="detail-loading">

                    Este Pokémon não possui
                    Mega Evolução.

                </div>

            `;

            return;

        }

        const megaHTML =
            megas.map(mega => {

                const megaTypes =
                    mega.types.map(item => {

                        const type =
                            item.type.name;

                        return `

                            <span
                                class="type ${typeClasses[type]}"
                            >

                                ${typeIcons[type]}
                                ${typeNames[type]}

                            </span>

                        `;

                    }).join("");

                return `

                    <div class="mega-card">

                        <h3>
                            ${mega.name}
                        </h3>

                        <div class="mega-images">

                            <div class="mega-image-box">

                                <h4>
                                    Forma Normal
                                </h4>

                                <img
                                    src="${mega.image}"
                                    alt="${mega.name}"
                                >

                            </div>

                            <div class="mega-image-box shiny">

                                <h4>
                                    ✨ Shiny
                                </h4>

                                <img
                                    src="${mega.shiny || mega.image}"
                                    alt="${mega.name} Shiny"
                                >

                            </div>

                        </div>

                        <div class="mega-types">
                            ${megaTypes}
                        </div>

                    </div>

                `;

            }).join("");

        megaTab.innerHTML = `

            <div class="mega-grid">

                ${megaHTML}

            </div>

        `;

    }catch(error){

        console.error(
            "Erro ao carregar Mega Evoluções:",
            error
        );

        megaTab.innerHTML = `

            <div class="detail-loading">

                Não foi possível carregar
                as Mega Evoluções.

            </div>

        `;

    }

}

/* =========================
   ABAS
========================= */

function changeTab(tabId,button){

    document
        .querySelectorAll(".tab")
        .forEach(tab =>
            tab.classList.remove("active")
        );

    document
        .querySelectorAll(".tab-content")
        .forEach(content =>
            content.classList.remove("active")
        );

    button.classList.add("active");

    document
        .getElementById(tabId)
        .classList.add("active");

}

/* =========================
   FRAQUEZAS
========================= */

async function getWeaknesses(types){

    const multipliers = {};

    Object.keys(typeNames).forEach(
        type => {
            multipliers[type] = 1;
        }
    );

    for(const typeSlot of types){

        const response =
            await fetch(
                `${API}/type/${typeSlot.type.name}`
            );

        const data =
            await response.json();

        data.damage_relations
            .double_damage_from
            .forEach(item => {

                multipliers[item.name] *= 2;

            });

        data.damage_relations
            .half_damage_from
            .forEach(item => {

                multipliers[item.name] *= 0.5;

            });

        data.damage_relations
            .no_damage_from
            .forEach(item => {

                multipliers[item.name] *= 0;

            });

    }

    return Object.keys(multipliers)
        .filter(
            type =>
                multipliers[type] > 1
        );

}

function filterGeneration(
    generation,
    button
){

    document
        .querySelectorAll(".filter")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    button.classList.add("active");

    currentGeneration =
        generation;

    if(generation === "all"){

        displayedPokemon =
            allPokemon;

    }else{

        displayedPokemon =
            allPokemon.filter(
                pokemon =>
                    pokemon.generation === generation
            );

    }

    visibleAmount = 40;

    renderPokemon();

}

   PESQUISA
========================= */

async function searchPokemon(){

    const input =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();

    if(!input){

        displayedPokemon =
            allPokemon;

    }else{

        displayedPokemon =
            allPokemon.filter(
                pokemon =>
                    pokemon.name.includes(input) ||
                    String(pokemon.id) === input
            );

    }

    visibleAmount = 40;

    renderPokemon();

}

document

            if(event.key === "Enter"){

                searchPokemon();

            }

        }
    );
